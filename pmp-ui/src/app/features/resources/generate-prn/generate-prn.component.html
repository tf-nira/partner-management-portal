<div class="generate-prn-container">
  <div class="header">
    <h2>{{ labels.generatePrnTitle || 'Generate PRN' }}</h2>
  </div>

  <div class="content-wrapper">
    <div class="form-section">
      <div class="form-card">
        <form [formGroup]="generatePrnForm" (ngSubmit)="generatePRN()">
          <div class="form-group">
            <label for="partnerId">{{ labels.partnerNameLabel || 'Partner Name' }}</label>
            <select 
              id="partnerId" 
              formControlName="partnerId" 
              class="form-control"
              [disabled]="isPartnerDropdownDisabled">
              <option value="">Select Partner</option>
              <option *ngFor="let partner of partners" [value]="partner.id">
                {{ partner.id }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="partnerType">{{ labels.partnerTypeLabel || 'Partner Type' }}</label>
            <select
              id="partnerType"
              formControlName="partnerType"
              class="form-control">
              <option *ngFor="let partnerType of partnerTypeOptions" [value]="partnerType">
                {{ partnerType }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="partnerGroup">{{ labels.partnerGroupLabel || 'Partner Group' }}</label>
            <select
              id="partnerGroup"
              formControlName="partnerGroup"
              class="form-control">
              <option *ngFor="let partnerGroup of partnerGroupOptions" [value]="partnerGroup">
                {{ partnerGroup }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="numberOfRecords">{{ labels.numberOfRecordsLabel || 'Number Of Records' }}</label>
            <input 
              type="number" 
              id="numberOfRecords" 
              formControlName="numberOfRecords" 
              class="form-control"
              min="1"
              placeholder="Enter number of records">
          </div>

          <div class="button-group">
            <button type="submit" class="btn btn-primary" [disabled]="generatePrnForm.invalid || isLoading">
              <span *ngIf="!isLoading">{{ labels.generateBtn || 'Generate PRN' }}</span>
              <span *ngIf="isLoading">{{ labels.generatingLabel || 'Generating...' }}</span>
            </button>
          </div>
        </form>
      </div>

      <div class="result-card" *ngIf="showPRNResult && !isLoading">
        <div [ngClass]="isSuccess ? 'success-message' : 'error-message'">
          <div class="icon" [ngClass]="isSuccess ? 'success' : 'error'">
            {{ isSuccess ? '✓' : '✗' }}
          </div>
          <div class="message">
            <p *ngIf="isSuccess"><strong>{{ labels.prnGeneratedLabel || 'PRN Generated Successfully' }}</strong></p>
            <p *ngIf="!isSuccess"><strong>{{ labels.prnFailedLabel || 'PRN generation failed, please try again' }}</strong></p>
            <p *ngIf="isSuccess" class="prn-value">{{ generatedPRN }}</p>
            <p *ngIf="!isSuccess" class="error-text">{{ errorMessage }}</p>
          </div>
        </div>
        <button class="btn btn-secondary" (click)="closePRNResult()">{{ labels.closeBtn || 'Close' }}</button>
      </div>
    </div>
  </div>
</div>
