<div class="search-payments-container">
  <div class="header">
    <h2>{{ labels.searchPaymentsTitle || 'Search Payments' }}</h2>
  </div>

  <div class="search-section">
    <div class="search-card">
      <form [formGroup]="searchForm" (ngSubmit)="searchPayments()">
        <div class="form-row">
          <div class="form-group">
            <label for="transactionId">{{ labels.transactionIdLabel || 'Transaction ID' }}</label>
            <input 
              type="text" 
              id="transactionId" 
              formControlName="transactionId" 
              class="form-control"
              placeholder="Enter Transaction ID">
          </div>

          <div class="form-group">
            <label for="partnerId">{{ labels.partnerNameLabel || 'Partner ID' }}</label>
            <select id="partnerId" formControlName="partnerId" class="form-control">
              <option value="">--Select--</option>
              <option *ngFor="let partner of partners" [value]="partner.partnerID">
                {{ partner.partnerID }}
              </option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="entryType">{{ labels.entryTypeLabel || 'Entry Type' }}</label>
            <select id="entryType" formControlName="entryType" class="form-control">
              <option value="">--Select--</option>
              <option value="DEBIT">DEBIT</option>
              <option value="CREDIT">CREDIT</option>
            </select>
          </div>

          <div class="form-group">
            <label for="sourceSystem">{{ labels.sourceSystemLabel || 'Source System' }}</label>
            <input 
              type="text" 
              id="sourceSystem" 
              formControlName="sourceSystem" 
              class="form-control"
              placeholder="Enter Source System">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="amount">{{ labels.amountLabel || 'Amount' }}</label>
            <input 
              type="number" 
              id="amount" 
              formControlName="amount" 
              class="form-control"
              placeholder="Enter Amount">
          </div>

          <div class="form-group">
            <label for="crDtimes">{{ labels.createdDateLabel || 'Created Date' }}</label>
            <input 
              type="date" 
              id="crDtimes" 
              formControlName="crDtimes" 
              class="form-control">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label for="description">{{ labels.descriptionLabel || 'Description' }}</label>
            <input 
              type="text" 
              id="description" 
              formControlName="description" 
              class="form-control"
              placeholder="Enter Description">
          </div>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary" [disabled]="isLoading">
            <span *ngIf="!isLoading">{{ labels.searchBtn || 'Search' }}</span>
            <span *ngIf="isLoading">{{ labels.searchingLabel || 'Searching...' }}</span>
          </button>
          <button type="button" class="btn btn-secondary" (click)="reset()">
            {{ labels.resetBtn || 'Reset' }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="results-section" *ngIf="showResults">
    <div class="results-card">
      <div class="results-header">
        <h3>{{ labels.resultsLabel || 'Results' }} ({{ totalRecords }} records)</h3>
        <button class="btn btn-export" (click)="exportResults()" *ngIf="searchResults.length > 0">
          {{ labels.exportBtn || 'Export' }}
        </button>
      </div>

      <div class="table-wrapper" *ngIf="searchResults.length > 0">
        <table class="results-table">
          <thead>
            <tr>
              <th *ngFor="let column of displayedColumns">
                {{ column.label[headerService.getlanguageCode()] || column.label['eng'] }}
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let payment of searchResults">
              <td *ngFor="let column of displayedColumns">
                {{ payment[column.name] }}
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="no-data" *ngIf="searchResults.length === 0">
        <p>{{ labels.noDataLabel || 'No records found' }}</p>
      </div>
    </div>
  </div>
</div>
