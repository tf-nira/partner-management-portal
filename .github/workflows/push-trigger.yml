name: PMP-ui build upon a push

on:
  release:
    types: [published]

  pull_request:
    types: [opened, reopened, synchronize]

  push:
    branches:
      - '!release-branch'
      - 'release*'
      - master
      - '1.0.*'
      - develop
      - '1.1.*'
      - 'MOSIP*'
      - '1.2.*'
      - tf_nira_dev
      - tf_nira_preprod
      - tf_nira_dev_QATEST

jobs:

  # ============================================================
  # PMP UI - Node.js Build
  # ============================================================
  build-maven-pmp-ui:
    name: Build PMP UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pmp-ui

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Node.js
      # Angular 8 project - use Node.js 12
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '12.22.12'

      # ----------------------------------------------------------
      # npm 6
      # Angular 8 / old package-lock compatibility
      # ----------------------------------------------------------
      - name: Set up npm 6
        run: |
          npm install -g npm@6.14.18

      # ----------------------------------------------------------
      # Display versions
      # ----------------------------------------------------------
      - name: Display Node.js and npm versions
        run: |
          node --version
          npm --version

      # ----------------------------------------------------------
      # Validate package.json
      # ----------------------------------------------------------
      - name: Validate package.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('package.json is valid JSON')"

      # ----------------------------------------------------------
      # Install dependencies
      #
      # IMPORTANT:
      # package.json and package-lock.json MUST be synchronized.
      # Do NOT delete package-lock.json in CI.
      # ----------------------------------------------------------
      - name: Install dependencies
        run: npm install

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------
      - name: Build PMP UI
        run: npm run build

      # ----------------------------------------------------------
      # Upload build artifact
      # ----------------------------------------------------------
      - name: Upload PMP UI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmp-ui-build
          path: pmp-ui/dist/
          if-no-files-found: error


  # ============================================================
  # PMP UI - Sonar Analysis
  # ============================================================
  sonar-analysis-pmp-ui:
    name: Sonar Analysis - PMP UI
    needs: build-maven-pmp-ui

    if: ${{ github.event_name != 'pull_request' }}

    uses: mosip/kattu/.github/workflows/npm-sonar-analysis.yml@master

    with:
      SERVICE_LOCATION: pmp-ui

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      ORG_KEY: ${{ secrets.ORG_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}


  # ============================================================
  # PMP Test - Maven Build
  # ============================================================
  build-maven-pmptest:
    name: Build PMP Test

    uses: mosip/kattu/.github/workflows/maven-build.yml@master

    with:
      SERVICE_LOCATION: pmptest
      BUILD_ARTIFACT: pmptest

    secrets:
      OSSRH_USER: ${{ secrets.OSSRH_USER }}
      OSSRH_SECRET: ${{ secrets.OSSRH_SECRET }}
      OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
      GPG_SECRET: ${{ secrets.GPG_SECRET }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}


  # ============================================================
  # PMP Test - Local Maven Build
  # ============================================================
  build-pmptest-local:
    name: Build PMP Test Local

    needs: build-maven-pmptest

    runs-on: ubuntu-latest

    env:
      NAMESPACE: ${{ secrets.DEV_NAMESPACE_DOCKER_HUB }}
      SERVICE_NAME: pmptest
      SERVICE_LOCATION: pmptest
      BUILD_ARTIFACT: pmptest-local

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Java
      # ----------------------------------------------------------
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          server-id: ossrh
          settings-path: ${{ github.workspace }}

      # ----------------------------------------------------------
      # Maven cache
      # ----------------------------------------------------------
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ----------------------------------------------------------
      # Maven settings.xml
      # ----------------------------------------------------------
      - name: Setup Maven settings.xml
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>ossrh</id>
                <username>${{ secrets.OSSRH_USER }}</username>
                <password>${{ secrets.OSSRH_SECRET }}</password>
              </server>
            </servers>

            <profiles>

              <profile>
                <id>ossrh</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>

                <properties>
                  <gpg.executable>gpg2</gpg.executable>
                  <gpg.passphrase>${{ secrets.GPG_SECRET }}</gpg.passphrase>
                </properties>
              </profile>

              <profile>
                <id>allow-snapshots</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>

                <repositories>

                  <repository>
                    <id>snapshots-repo</id>
                    <url>https://oss.sonatype.org/content/repositories/snapshots</url>

                    <releases>
                      <enabled>false</enabled>
                    </releases>

                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </repository>

                  <repository>
                    <id>releases-repo</id>
                    <url>https://oss.sonatype.org/service/local/staging/deploy/maven2</url>

                    <releases>
                      <enabled>true</enabled>
                    </releases>

                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>

                </repositories>
              </profile>

              <profile>
                <id>sonar</id>

                <properties>
                  <sonar.sources>.</sonar.sources>
                  <sonar.host.url>https://sonarcloud.io</sonar.host.url>
                </properties>

                <activation>
                  <activeByDefault>false</activeByDefault>
                </activation>
              </profile>

            </profiles>
          </settings>
          EOF

      # ----------------------------------------------------------
      # Maven build
      # ----------------------------------------------------------
      - name: Build pmptest with Maven
        run: |
          cd "${{ env.SERVICE_LOCATION }}"

          mvn -U -B package \
            -Dmaven.wagon.http.retryHandler.count=2 \
            --file pom.xml \
            -s "$GITHUB_WORKSPACE/settings.xml"

      # ----------------------------------------------------------
      # Prepare Spring Boot artifacts
      # ----------------------------------------------------------
      - name: Prepare Spring Boot artifacts
        if: ${{ !contains(github.ref, 'master') && !contains(github.ref, 'main') }}
        run: |
          find "${{ env.SERVICE_LOCATION }}" \
            -path '*/target/*' \
            -name '*.jar' \
            -type f \
            -exec zip "${{ env.BUILD_ARTIFACT }}.zip" {} +

      # ----------------------------------------------------------
      # Upload Spring Boot JARs
      # ----------------------------------------------------------
      - name: Upload Spring Boot JARs
        if: ${{ !contains(github.ref, 'master') && !contains(github.ref, 'main') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: ${{ env.BUILD_ARTIFACT }}.zip
          if-no-files-found: error

      # ----------------------------------------------------------
      # Slack notification
      # ----------------------------------------------------------
      - name: Slack notification
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,author,commit,workflow,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}


  # ============================================================
  # PMP Test - Docker Build
  # ============================================================
  build-dockers-pmptest:
    name: Build Docker - pmptest

    needs: build-pmptest-local

    strategy:
      fail-fast: false

      matrix:
        include:
          - SERVICE_LOCATION: pmptest
            SERVICE_NAME: pmptest
            BUILD_ARTIFACT: pmptest-local

    uses: mosip/kattu/.github/workflows/docker-build.yml@master

    with:
      SERVICE_LOCATION: ${{ matrix.SERVICE_LOCATION }}
      SERVICE_NAME: ${{ matrix.SERVICE_NAME }}
      BUILD_ARTIFACT: ${{ matrix.BUILD_ARTIFACT }}

    secrets:
      DEV_NAMESPACE_DOCKER_HUB: ${{ secrets.DEV_NAMESPACE_DOCKER_HUB }}
      ACTOR_DOCKER_HUB: ${{ secrets.ACTOR_DOCKER_HUB }}
      RELEASE_DOCKER_HUB: ${{ secrets.RELEASE_DOCKER_HUB }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}


  # ============================================================
  # PMP Test - Sonar Analysis
  # ============================================================
  sonar_analysis:
    name: Sonar Analysis - pmptest

    needs: build-pmptest-local

    if: ${{ github.event_name != 'pull_request' }}

    uses: mosip/kattu/.github/workflows/maven-sonar-analysis.yml@master

    with:
      SERVICE_LOCATION: pmptest

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      ORG_KEY: ${{ secrets.ORG_KEY }}
      OSSRH_USER: ${{ secrets.OSSRH_USER }}
      OSSRH_SECRET: ${{ secrets.OSSRH_SECRET }}
      OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
      GPG_SECRET: ${{ secrets.GPG_SECRET }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
